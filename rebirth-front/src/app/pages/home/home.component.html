<div class="container py-5">
    <h2 class="text-center mb-4">Nuestra Colección</h2>
    <div class="row">
      <div class="col-lg-3 col-md-4 col-sm-6 mb-4" *ngFor="let product of products">
        <div class="card border-0 shadow-sm h-100">
          
          <!-- Imagen con enlace -->
          <a [routerLink]="['/producto', product.id_producto]" class="position-relative">
            <img [src]="product.imagenes[0]?.url_imagen" class="card-img-top img-fluid rounded" alt="{{ product.nombre }}">
            <div class="badge bg-dark text-white position-absolute top-0 start-0 m-2 px-3 py-2">Nuevo</div>
          </a>

          <!-- Recorremos los colores agrupados por cada producto -->
          <div *ngIf="productosAgrupadosPorColor[product.id_producto]">
            <div *ngFor="let entry of productosAgrupadosPorColor[product.id_producto] | keyvalue">
              
              <!-- Mostrar color -->
              <p [ngClass]="{'color-available': entry.value, 'color-unavailable': !entry.value}">
                Color: {{ entry.key }}
              </p>

              <!-- Mostrar el stock disponible -->
              <p *ngIf="entry.value; else noStock">
                Stock disponible: Sí
              </p>
              <ng-template #noStock>
                <p>Stock disponible: <span class="stock-unavailable">X</span></p> <!-- Mostrar "X" si no está disponible -->
              </ng-template>
            </div>
          </div>

          
          <div class="card-body text-center">
            <h5 class="card-title">{{ product.nombre }}</h5>
            <p class="card-text text-muted">{{ product.descripcion }}</p>
            <p class="card-text fw-bold text-primary">$ {{ product.precio }}</p>
          </div>
          
          <div class="card-footer bg-white border-0 text-center">
            <!-- Botón con enlace a la página de detalles -->
            <a [routerLink]="['/producto', product.id_producto]" class="btn btn-dark w-100">Ver detalles</a>
          </div>
  
        </div>
      </div>
    </div>
  </div>
